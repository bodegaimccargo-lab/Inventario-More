  if(!items.length)return'<div class="empty">Sin datos</div>';
  const W=440,H=220,pl=8,pt=24,pb=34,n=items.length,bw=(W-2*pl)/n,mx=Math.max(...items.map(i=>i.v),1),ph=H-pt-pb;
  return `<svg class="sv" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px;display:block;margin:0 auto"><line class="gl" x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}"/>`+items.map((i,k)=>{const h=i.v/mx*ph,x=pl+k*bw+bw*.17,w=bw*.66,y=H-pb-h;return `<rect class="bb" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"><title>${esc(i.l)}: ${fmt(i.v)}</title></rect><text class="vv" x="${x+w/2}" y="${y-6}" text-anchor="middle">${fmt(i.v)}</text><text x="${x+w/2}" y="${H-pb+16}" text-anchor="middle">${esc(i.l.replace('IMP 2026-','IMP '))}</text>`}).join('')+'</svg>';
}
function pareto(items,tot){
  if(!items.length)return'<div class="empty">Sin datos</div>';
  const W=680,H=270,pl=46,pr=46,pt=18,pb=48,n=items.length,bw=(W-pl-pr)/n,mx=Math.max(...items.map(i=>i.v),1),ph=H-pt-pb;let cum=0,pts=[];
  let s=`<svg class="sv" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:820px;display:block;margin:0 auto">`;
  [0,.5,1].forEach(t=>{const y=pt+ph*(1-t);s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(mx*t)}</text><text x="${W-pr+6}" y="${y+4}">${t*100}%</text>`});
  items.forEach((i,k)=>{const h=i.v/mx*ph,x=pl+k*bw+bw*.18,w=bw*.64;cum+=i.v;const cx=x+w/2,cy=pt+ph*(1-cum/tot);pts.push([cx,cy,cum/tot]);
    s+=`<rect class="bb" x="${x}" y="${pt+ph-h}" width="${w}" height="${h}" rx="3" opacity=".8"><title>${esc(i.l)}: ${fmt(i.v)}</title></rect><text x="${cx}" y="${H-pb+15}" text-anchor="middle">${esc(sh(i.p,9))}</text>`});
  s+=`<polyline class="ln" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`+pts.map(p=>`<circle class="dt" cx="${p[0]}" cy="${p[1]}" r="3.5"/><text class="vv" x="${p[0]}" y="${p[1]-8}" text-anchor="middle">${(p[2]*100).toFixed(0)}%</text>`).join('');
  return s+'</svg>';
}
function drawInd(){
  const r=INV.filter(x=>!S.doc||x.doc===S.doc),tot=r.reduce((a,x)=>a+x.stock,0)||1;
  const M=group(r).sort((a,b)=>b.stock-a.stock),P=m=>({l:m.txt,s:m.part+' · '+m.mat,v:m.stock});
  const agg=k=>{const m=new Map();r.forEach(x=>m.set(x[k],(m.get(x[k])||0)+x.stock));return[...m].map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v)};
  const L=agg('loc'),D=agg('doc'),t3=M.slice(0,3).reduce((a,x)=>a+x.stock,0),lo=M[M.length-1];
  $('ins').innerHTML=M.length?[
    ['Producto con más stock',M[0].txt,`${fmt(M[0].stock)} uds · ${(M[0].stock/tot*100).toFixed(1)}% del total`],
    ['Concentración Top 3',`${(t3/tot*100).toFixed(1)}% del inventario`,`${fmt(t3)} de ${fmt(tot)} unidades`],
    ['Ubicación con más stock',L[0].l,`${fmt(L[0].v)} unidades`],
    ['Producto con menos stock',lo.txt,`${fmt(lo.stock)} uds`]
  ].map(([a,b,c])=>`<div class="in"><span>${a}</span><b>${esc(b)}</b><small>${c}</small></div>`).join(''):'';
  const top5=M.slice(0,5).map(m=>({l:m.txt,v:m.stock})),rest=tot-top5.reduce((a,x)=>a+x.v,0);
  $('d1').innerHTML=M.length?donut(rest>0?[...top5,{l:'Otros productos',v:rest}]:top5,tot):'<div class="empty">Sin datos</div>';
  $('d2').innerHTML=colChart(D.slice(0,8));
  $('d3').innerHTML=pareto(M.slice(0,10).map(m=>({l:m.txt,p:m.part,v:m.stock})),tot);
  $('c1').innerHTML=bars(M.slice(0,+$('topN').value).map(P),tot);
  $('c3').innerHTML=bars(L.slice(0,8),tot);
  $('c4').innerHTML=bars(M.slice(-5).reverse().map(P),tot);
}
function render(){
  const C=COLS[cols()],r=rows();kpis();
  $('th').innerHTML='<tr>'+C.map(c=>`<th class="${c.n?'n':''}" data-k="${c.k}">${c.l}${S.k===c.k?(S.d>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>';
  $('tb').innerHTML=r.length?r.map(x=>'<tr>'+C.map(c=>`<td class="${c.n?'n':''} ${c.w?'wrap':''}">${c.n?fmt(x[c.k]):esc(x[c.k])}</td>`).join('')+'</tr>').join(''):`<tr><td class="empty" colspan="${C.length}">Sin resultados</td></tr>`;
  $('cnt').textContent=`${r.length} registro${r.length===1?'':'s'}`;
  const ind=S.tab==='ind';
  ['q','seg','cnt'].forEach(i=>$(i).style.display=ind?'none':(i==='seg'?'flex':''));
  document.querySelector('.tw').style.display=ind?'none':'';$('ind').style.display=ind?'block':'none';
  if(ind)drawInd();
}
function exportXlsx(){
  if(typeof XLSX==='undefined'){alert('No se pudo cargar la librería de Excel. Revisa tu conexión a internet.');return}
  const wb=XLSX.utils.book_new(),add=(n,a,w)=>{const ws=XLSX.utils.json_to_sheet(a);ws['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,n)};
  const q=S.q.toLowerCase(),f=INV.filter(x=>(!S.doc||x.doc===S.doc)&&(!q||Object.values(x).some(v=>String(v).toLowerCase().includes(q))));
  add('Inventario',f.map(x=>({'Documento de Transporte':x.doc,'Ubicación':x.loc,'Material':x.mat,'Nº pieza fabricante':x.part,'Texto breve de material':x.txt,'Stock total':x.stock,'Cliente':x.cli})),[22,14,12,30,44,12,20]);
  add('Resumen por material',group(f).sort((a,b)=>b.stock-a.stock).map(x=>({'Material':x.mat,'Nº pieza fabricante':x.part,'Descripción':x.txt,'Ubicaciones':x.ubic,'Documentos':x.docs,'Stock total':x.stock})),[12,30,44,12,30,12]);
  XLSX.writeFile(wb,'Inventario_MoreProducts_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
$('q').oninput=e=>{S.q=e.target.value;render()};
$('topN').onchange=drawInd;
$('doc').onchange=e=>{S.doc=e.target.value;render()};
$('th').onclick=e=>{const k=e.target.dataset.k;if(!k)return;S.d=S.k===k?-S.d:1;S.k=k;render()};
$('seg').onclick=e=>{const v=e.target.dataset.v;if(!v)return;S.view=v;S.k=null;[...$('seg').children].forEach(b=>b.classList.toggle('on',b.dataset.v===v));render()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()});
$('bRef').onclick=load;$('bExp').onclick=exportXlsx;
load();setInterval(load,CONFIG.REFRESH_MIN*60000);
</script>
